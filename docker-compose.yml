name: ${COMPOSE_PROJECT_NAME:-onec_smart}

services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command:
      - gunicorn
      - -w
      - "1"
      - -k
      - uvicorn.workers.UvicornWorker
      - app.main:app
      - --bind
      - 0.0.0.0:8000
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --capture-output
      - --timeout
      - "60"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      UPLOAD_DIR: /data/onec_smart/uploads
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      BACKEND_WORKERS: ${BACKEND_WORKERS:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DB_POOL_SLOW_CHECKOUT_SECONDS: ${DB_POOL_SLOW_CHECKOUT_SECONDS:-2}
      DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-500}
    volumes:
      - ./backend/app/uploads:/data/onec_smart/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
