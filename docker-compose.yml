name: ${COMPOSE_PROJECT_NAME:-onec_smart}

services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # Le nombre de workers vient de BACKEND_WORKERS (voir .env). Ne pas le
    # réécrire en dur ici : la commande écrase le CMD de l'image, donc une
    # valeur figée rend la variable d'environnement sans effet.
    command:
      - gunicorn
      - -w
      - "${BACKEND_WORKERS:-4}"
      - -k
      - uvicorn.workers.UvicornWorker
      - app.main:app
      - --bind
      - 0.0.0.0:8000
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --capture-output
      # 60 s tuait des workers seulement en retard, pas bloqués : le
      # redémarrage prend plusieurs minutes et la file repartait sur le worker
      # neuf, d'où une boucle de panne. graceful-timeout laisse les requêtes en
      # cours se terminer avant l'arrêt.
      - --timeout
      - "${BACKEND_TIMEOUT:-120}"
      - --graceful-timeout
      - "30"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      UPLOAD_DIR: /data/onec_smart/uploads
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      BACKEND_WORKERS: ${BACKEND_WORKERS:-4}
      # Budget de connexions = workers x (pool_size + max_overflow).
      # 4 x (5 + 5) = 40, sous le max_connections de PostgreSQL (100 par défaut).
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DB_POOL_SLOW_CHECKOUT_SECONDS: ${DB_POOL_SLOW_CHECKOUT_SECONDS:-2}
      DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-500}
      AUTH_CONTEXT_CACHE_ENABLED: ${AUTH_CONTEXT_CACHE_ENABLED:-true}
      AUTH_CONTEXT_CACHE_TTL_SECONDS: ${AUTH_CONTEXT_CACHE_TTL_SECONDS:-30}
      REPORT_SUMMARY_CACHE_TTL_SECONDS: ${REPORT_SUMMARY_CACHE_TTL_SECONDS:-15}

      # ── Ordonnanceurs ────────────────────────────────────────────────────────
      # Doit valoir LA MEME CHOSE ici et sur exports-worker : les deux services
      # lisent ce reglage pour savoir lequel des deux demarre les rapports
      # planifies et la garde de facturation. Deux valeurs divergentes donnent
      # soit une double execution, soit — bien pire, parce que silencieux —
      # aucune. false = comportement historique, porte par le backend.
      SCHEDULERS_IN_WORKER: ${SCHEDULERS_IN_WORKER:-false}

      # ── Exports Excel ────────────────────────────────────────────────────────
      # Plafond de lignes d'un export direct. Au-dela, refus 413 immediat plutot
      # qu'un worker tenu jusqu'a ce que --timeout le tue (et emporte avec lui
      # les requetes de ses voisins). 0 desactive le plafond — utile le temps
      # d'une campagne de charge sur un tenant volumineux.
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-60000}
    volumes:
      - ./backend/app/uploads:/data/onec_smart/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always


  # ─── Worker d'exports ─────────────────────────────────────────────────────────
  # MEME IMAGE que le backend, commande differente : c'est ce qui garantit que le
  # code metier ne diverge jamais entre le chemin HTTP et le chemin asynchrone.
  # Un export construit ici appelle exactement la fonction qu'appelle
  # GET /exports/budget.
  #
  # Ne sert a rien tant qu'EXPORT_ASYNC_TYPES est vide : le conteneur tourne, la
  # file reste vide, les balayages ne trouvent rien. C'est voulu — on deploie
  # l'infrastructure d'abord, on ouvre le drapeau ensuite.
  exports-worker:
    build: ./backend
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    env_file: .env
    environment:
      UPLOAD_DIR: /data/onec_smart/uploads
      REDIS_URL: redis://redis:6379/0
      # Le backend est seul a migrer. Deux processus lancant `alembic upgrade`
      # au meme instant se disputent la table de version.
      RUN_MIGRATIONS_ON_STARTUP: "false"
      # Budget de connexions : 4 x (5 + 5) + 1 x (2 + 2) = 44, a comparer aux
      # ~97 utilisables de PostgreSQL. Le worker ne PEUT PAS manger le pool du
      # service HTTP — c'est une propriete du dimensionnement, pas une
      # convention. Deux connexions suffisent : la session du job, et celle qui
      # renouvelle son bail.
      BACKEND_WORKERS: "1"
      DB_POOL_SIZE: ${EXPORT_WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${EXPORT_WORKER_DB_MAX_OVERFLOW:-2}
      # Meme valeur que sur le service backend, obligatoirement (cf. son
      # commentaire). C'est ce conteneur qui portera les ordonnanceurs quand ce
      # reglage passera a true.
      SCHEDULERS_IN_WORKER: ${SCHEDULERS_IN_WORKER:-false}
      # Un job a la fois. Un seul export a ete mesure a +310 Mo de RSS.
      EXPORT_WORKER_CONCURRENCY: ${EXPORT_WORKER_CONCURRENCY:-1}
    healthcheck:
      # Un worker n'a pas de port : la sonde lit la cle de vitalite qu'il ecrit
      # dans Redis (health_check_key). start_period couvre le demarrage
      # applicatif, mesure entre 34 et 50 s.
      test: ["CMD", "arq", "--check", "app.workers.arq_worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - ./backend/app/uploads:/data/onec_smart/uploads
    # Meme limite qu'en production (docker-compose.prod.yml). Elle n'est pas
    # decorative en developpement : +310 Mo de RSS mesures pour un seul export,
    # non rendus a la fin par l'allocateur. Sans plafond, c'est la machine du
    # developpeur qui arbitre — et l'OOM-killer y emporte PostgreSQL aussi
    # volontiers qu'en production. Un ecart de limite entre les deux fichiers,
    # c'est un comportement memoire qu'on ne reproduit jamais avant la prod.
    mem_limit: 1g

  # ─── Execution de la suite de tests ─────────────────────────────────────────
  # Conteneur DEDIE, jamais demarre par `docker compose up` (profil "test").
  #
  #   docker compose --profile test run --rm backend-tests
  #   docker compose --profile test run --rm backend-tests pytest tests/test_encaissements.py -q
  #
  # Pourquoi un service a part plutot que `exec` dans le backend :
  #   - le backend fait tourner 4 workers gunicorn ; y lancer la suite mettait
  #     les deux en concurrence et l'OOM-killer emportait le conteneur (code
  #     137), qui redemarrait aussitot en emportant pytest avec lui ;
  #   - `tests/` est exclu de l'image applicative (.dockerignore), il fallait
  #     donc l'y copier a la main avant chaque execution ;
  #   - pytest devait etre reinstalle apres chaque redemarrage, sans garantie
  #     de versions : l'image `tests` les embarque, epinglees.
  backend-tests:
    build:
      context: ./backend
      target: tests
    profiles: ["test"]
    env_file: .env
    environment:
      # Base DEDIEE : le harnais fait DROP SCHEMA a chaque session. Elle ne doit
      # jamais pointer la base applicative — d'ou le suffixe explicite ici
      # plutot qu'une reutilisation de DATABASE_URL.
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      # Aucune migration : le schema de test vient des modeles.
      RUN_MIGRATIONS_ON_STARTUP: "false"
      # L'application cree son repertoire d'uploads des l'import de app.main.
      # Le service backend le monte depuis l'hote ; ici on l'envoie vers un
      # chemin jetable, pour deux raisons : le conteneur de test n'a pas ce
      # montage (l'import echouait en PermissionError sur /data), et la suite
      # ne doit de toute facon jamais ecrire dans les uploads reels.
      UPLOAD_DIR: /tmp/onec-test-uploads
    volumes:
      # Code et tests montes en direct : editer puis relancer, sans rebuild ni
      # copie manuelle. On ne monte PAS /app en entier, pour que le repertoire
      # reste celui de l'image (appartenant a l'utilisateur `app`) et que pytest
      # puisse y ecrire son cache.
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/alembic:/app/alembic:ro
    depends_on:
      db:
        condition: service_healthy
    # Plus haut que le backend : la suite construit tout le schema et garde des
    # sessions ouvertes. Le plafond reste explicite pour qu'un test qui derive
    # en memoire echoue ici, et non en emportant la machine.
    mem_limit: 2g

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      # Meme role qu'en production (location /_protected_uploads/ de
      # frontend/nginx.conf). En dev UPLOAD_DIR vaut /data/onec_smart/uploads
      # cote backend, mais le point de montage est ici le meme qu'en prod pour
      # qu'un seul nginx.conf serve les deux environnements.
      - ./backend/app/uploads:/var/www/onec_smart_data/uploads:ro
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
