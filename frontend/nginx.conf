server {
    listen 80;
    server_name localhost *.localhost onec-rdc.org www.onec-rdc.org *.onec-rdc.org;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://api.onec-rdc.org data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.onec-rdc.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Compression : JS/CSS applicatifs représentent plusieurs Mo non
    # compressés (chunks vendor xlsx/jspdf/recharts inclus). gzip seul
    # réduit déjà le poids transféré d'environ 65-70% sur ces contenus.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/wasm
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # index.html référence les noms de fichiers hashés générés par Vite ;
        # s'il reste en cache navigateur, un déploiement rend les anciens
        # utilisateurs incapables de récupérer les nouveaux chunks (404 sur
        # les vieux assets déjà purgés). Toujours revalider.
        #
        # On utilise "expires -1" (qui émet Cache-Control: no-cache) et NON
        # un add_header : dans nginx, un add_header dans un location annule
        # TOUS les add_header hérités du niveau server. Un add_header ici
        # supprimerait donc la CSP et les en-têtes de sécurité sur le
        # document HTML lui-même.
        expires -1;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Timeouts. Le defaut nginx est 60 s, et il etait atteint : un export
        # d'encaissements sur un exercice complet dure 112 s cote serveur
        # (mesure du 28/08). nginx rendait un 504 a 60,9 s, le worker backend
        # continuait a generer le classeur jusqu'au bout, et l'utilisateur
        # n'obtenait rien pour un travail entierement paye.
        #
        # 130 s = --timeout gunicorn (120 s, docker-compose*.yml) + 10 s. La
        # marge est deliberee : c'est l'arbitre gunicorn qui doit trancher le
        # sort d'une requete trop longue, pas nginx. Si nginx coupait le
        # premier, on perdrait la reponse d'erreur applicative et on lirait un
        # 504 opaque a la place de la cause.
        #
        # Ce reglage ne rend pas les exports longs sains pour autant : au-dela
        # de ~120 s l'arbitre tue le worker, et avec lui les requetes de ses
        # voisins (UvicornWorker). C'est la raison d'etre de la generation
        # asynchrone, cf. docs/architecture-exports-asynchrones-20260828.md.
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Livraison des fichiers proteges sans occuper un worker Python. Le backend
    # verifie le jeton et l'appartenance du fichier au tenant, puis repond un
    # corps VIDE portant `X-Accel-Redirect: /_protected_uploads/<chemin>`
    # (backend/app/api/v1/endpoints/secure_uploads.py:55) ; c'est nginx qui lit
    # le fichier sur disque et l'envoie. Le fichier ne transite jamais par la
    # memoire du processus Python.
    #
    # Ce bloc n'existait que dans docs/nginx/backend-secure-uploads.conf, qui
    # n'est copie dans aucune image et ne correspond a aucun service des
    # docker-compose (constat C5 de perf-infra.md). Sans lui, la redirection
    # interne ne matche que `location /` et retombe sur `try_files ...
    # /index.html` : le navigateur recoit la page HTML de l'application, en 200,
    # a la place de sa piece jointe.
    #
    # `internal` n'est pas decoratif : il rend cette URL inatteignable depuis
    # l'exterieur. Seule une redirection interne emise par le backend y donne
    # acces. Sans cette directive, /_protected_uploads/... servirait les
    # fichiers de toutes les organisations sans aucune authentification.
    #
    # `alias` doit pointer sur le meme repertoire que UPLOAD_DIR cote backend :
    # les deux docker-compose montent ce chemin dans le conteneur frontend, en
    # lecture seule.
    location /_protected_uploads/ {
        internal;
        alias /var/www/onec_smart_data/uploads/;

        # Contenus immuables (logos, cachets, pieces jointes, et demain les
        # classeurs d'export asynchrones) : cache navigateur, jamais partage par
        # un proxy — ces fichiers sont nominatifs.
        #
        # PAS de directive `expires` ici, contrairement a /assets/ : `expires`
        # ecrit lui-meme un `Cache-Control: max-age=...`, et l'add_header
        # ci-dessous en ajoute un SECOND. Sur /assets/ les deux valeurs
        # concordent ; ici la premiere serait depourvue de `private`, et un
        # proxy intermediaire qui lit la premiere occurrence pourrait mettre en
        # cache partage un document nominatif. Une seule directive, une seule
        # verite.
        add_header Cache-Control "private, max-age=3600, no-transform" always;
        # Ce bloc contient un add_header : les add_header du niveau server sont
        # donc ignores ici et doivent etre repetes, meme regle qu'en /assets/.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # La CSP du niveau server autorise des scripts ('self') : elle a un sens
        # pour le document applicatif, aucun pour un fichier televerse par un
        # utilisateur et servi depuis la MEME origine. Un .html ou un .svg depose
        # comme piece jointe s'executerait avec les droits de l'application. On
        # ne repete donc pas la CSP du server, on en pose une plus stricte.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        # Noms de fichiers hashés par Vite (ex: index-CE7YN-i7.js) : le
        # contenu d'une URL donnée ne change jamais, donc "immutable" évite
        # même la requête de revalidation conditionnelle.
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        # Ce bloc contient un add_header : les add_header du niveau server
        # sont donc ignorés ici et doivent être répétés (nosniff notamment,
        # qui protège le chargement des .js/.css).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
