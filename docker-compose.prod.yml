services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      ENV: production
      SERVE_UPLOADS_PUBLICLY: "false"
      UPLOAD_DIR: /var/www/one_cpk_data/uploads
    volumes:
      - /var/www/one_cpk_data/uploads:/var/www/one_cpk_data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
