name: ${COMPOSE_PROJECT_NAME:-onec_smart}

services:

  # ─── Cache Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    # Persistance optionnelle (AOF) — à activer si les sessions ou jobs critiques
    # dépendent du cache après redémarrage.
    # command: ["redis-server", "--appendonly", "yes"]
    # volumes:
    #   - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Base de données PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ─── Backend FastAPI ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    # Sans `command:`, le conteneur exécutait le CMD de l'image
    # (backend/Dockerfile : `gunicorn -w 4` figé, sans --timeout), rendant
    # BACKEND_WORKERS inopérant et laissant le timeout gunicorn au défaut de
    # 30 s — exactement la valeur de DB_POOL_TIMEOUT par défaut. Une requête
    # atteignait donc la limite du pool à l'instant où l'arbitre tuait le
    # worker, qui emportait avec lui toutes ses requêtes concurrentes
    # (UvicornWorker). C'est la boucle de panne documentée dans
    # docs/PERFORMANCE_LOAD_AUDIT_20260803.md, dont le correctif n'existait
    # jusqu'ici que dans docker-compose.yml (dev).
    command:
      - gunicorn
      - -w
      - "${BACKEND_WORKERS:-4}"
      - -k
      - uvicorn.workers.UvicornWorker
      - app.main:app
      - --bind
      - 0.0.0.0:8000
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --capture-output
      - --timeout
      - "${BACKEND_TIMEOUT:-120}"
      - --graceful-timeout
      - "30"
    expose:
      - "8000"
    env_file: .env
    environment:
      ENV: production
      SERVE_UPLOADS_PUBLICLY: "false"
      UPLOAD_DIR: /var/www/onec_smart_data/uploads

      # ── Workers et pool de connexions ────────────────────────────────────────
      # Budget de connexions = workers x (pool_size + max_overflow).
      # 4 x (5 + 5) = 40, sous le max_connections de PostgreSQL (100 par défaut).
      # Valeurs reprises telles quelles de docker-compose.yml : ce sont celles
      # qui ont été validées sous charge, et la prod n'avait jamais reçu ce
      # travail (le commit 8003109 n'a touché que le fichier de dev).
      BACKEND_WORKERS: ${BACKEND_WORKERS:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      # Doit rester nettement sous --timeout : échouer vite sur un pool saturé
      # vaut mieux que se faire tuer par l'arbitre.
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DB_POOL_SLOW_CHECKOUT_SECONDS: ${DB_POOL_SLOW_CHECKOUT_SECONDS:-2}
      DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-500}
      AUTH_CONTEXT_CACHE_ENABLED: ${AUTH_CONTEXT_CACHE_ENABLED:-true}
      AUTH_CONTEXT_CACHE_TTL_SECONDS: ${AUTH_CONTEXT_CACHE_TTL_SECONDS:-30}
      REPORT_SUMMARY_CACHE_TTL_SECONDS: ${REPORT_SUMMARY_CACHE_TTL_SECONDS:-15}

      # Exécute `alembic upgrade head` au démarrage du conteneur.
      # Mettre à "false" uniquement si les migrations sont appliquées par une étape CI/CD séparée.
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}

      # Cache Redis (pointe vers le service « redis » défini ci-dessus)
      REDIS_URL: redis://redis:6379/0
      REDIS_DEFAULT_TTL: "300"

      # ── Exports Excel ────────────────────────────────────────────────────────
      # Plafond de lignes d'un export direct. Au-dela, refus 413 immediat plutot
      # qu'un worker tenu jusqu'a ce que --timeout le tue (et emporte avec lui
      # les requetes de ses voisins). 0 desactive le plafond — utile le temps
      # d'une campagne de charge sur un tenant volumineux.
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-60000}

      # ── Prometheus /metrics ──────────────────────────────────────────────────
      # true  → /metrics monté.
      # false → /metrics désactivé complètement.
      ENABLE_METRICS: ${ENABLE_METRICS:-false}
      # Obligatoire en production si ENABLE_METRICS=true.
      # Générez un secret fort : openssl rand -hex 32
      METRICS_TOKEN: ${METRICS_TOKEN:-}

      # ── Alertes email (erreurs 5xx) ──────────────────────────────────────────
      # Laisser vide désactive silencieusement les alertes email.
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: 587
      # SMTP_USER: alerts@example.com
      # SMTP_PASSWORD: CHANGE_ME_SMTP_PASSWORD

      # ── Alertes Telegram (erreurs 5xx) ───────────────────────────────────────
      # Créez un bot via @BotFather et ajoutez-le à votre groupe de monitoring.
      # Rate-limité : 1 alerte par type d'erreur toutes les 5 minutes.
      # TELEGRAM_BOT_TOKEN: CHANGE_ME_BOT_TOKEN
      # TELEGRAM_CHAT_ID: CHANGE_ME_CHAT_ID

    volumes:
      - /var/www/onec_smart_data/uploads:/var/www/onec_smart_data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ─── Frontend Nginx ───────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      # X-Accel-Redirect : nginx sert lui-meme les fichiers proteges (voir la
      # location /_protected_uploads/ de frontend/nginx.conf). Meme repertoire
      # que UPLOAD_DIR cote backend, monte en LECTURE SEULE : ce conteneur sert
      # les fichiers, il n'a aucune raison d'y ecrire.
      - /var/www/onec_smart_data/uploads:/var/www/onec_smart_data/uploads:ro
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  # redis_data:  # décommenter si la persistance Redis est activée
