services:

  # ─── Cache Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    # Persistance optionnelle (AOF) — à activer si les sessions ou jobs critiques
    # dépendent du cache après redémarrage.
    # command: ["redis-server", "--appendonly", "yes"]
    # volumes:
    #   - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Base de données PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ─── Backend FastAPI ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    expose:
      - "8000"
    env_file: .env
    environment:
      ENV: production
      SERVE_UPLOADS_PUBLICLY: "false"
      UPLOAD_DIR: /var/www/one_cpk_data/uploads

      # Exécute `alembic upgrade head` au démarrage du conteneur.
      # Mettre à "false" uniquement si les migrations sont appliquées par une étape CI/CD séparée.
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}

      # Cache Redis (pointe vers le service « redis » défini ci-dessus)
      REDIS_URL: redis://redis:6379/0
      REDIS_DEFAULT_TTL: "300"

      # ── Prometheus /metrics ──────────────────────────────────────────────────
      # true  → /metrics monté.
      # false → /metrics désactivé complètement.
      ENABLE_METRICS: ${ENABLE_METRICS:-false}
      # Obligatoire en production si ENABLE_METRICS=true.
      # Générez un secret fort : openssl rand -hex 32
      METRICS_TOKEN: ${METRICS_TOKEN:-}

      # ── Alertes email (erreurs 5xx) ──────────────────────────────────────────
      # Laisser vide désactive silencieusement les alertes email.
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: 587
      # SMTP_USER: alerts@example.com
      # SMTP_PASSWORD: CHANGE_ME_SMTP_PASSWORD

      # ── Alertes Telegram (erreurs 5xx) ───────────────────────────────────────
      # Créez un bot via @BotFather et ajoutez-le à votre groupe de monitoring.
      # Rate-limité : 1 alerte par type d'erreur toutes les 5 minutes.
      # TELEGRAM_BOT_TOKEN: CHANGE_ME_BOT_TOKEN
      # TELEGRAM_CHAT_ID: CHANGE_ME_CHAT_ID

    volumes:
      - /var/www/one_cpk_data/uploads:/var/www/one_cpk_data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ─── Frontend Nginx ───────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  # redis_data:  # décommenter si la persistance Redis est activée
