# Vhost de l'API (api.onec-rdc.org), tenu sur l'hote — aucune image ne le copie.
# A tenir aligne avec la `location /_protected_uploads/` de frontend/nginx.conf :
# les deux servent le meme repertoire, avec le meme contrat X-Accel-Redirect.

# Origines autorisees a LIRE une reponse de cette API depuis un navigateur.
#
# POURQUOI CE MAP EXISTE. nginx ne recopie pas les en-tetes arbitraires de la
# reponse amont quand il traite un `X-Accel-Redirect` : seule une liste fermee
# survit a la redirection interne (Content-Type, Content-Disposition,
# Cache-Control, Expires, Set-Cookie, Vary...). `Access-Control-Allow-Origin`,
# emis par CORSMiddleware (app/main.py), n'en fait PAS partie — il est perdu au
# moment exact ou nginx prend la main sur le fichier.
#
# Consequence en production, ou l'application (onec-rdc.org) et l'API
# (api.onec-rdc.org) sont deux origines : le navigateur recoit une reponse 200
# sans en-tete CORS et refuse de la rendre au JavaScript. Le telechargement
# echoue, la meme URL collee dans un onglet fonctionne, et le backend n'a rien
# a signaler dans ses journaux puisqu'il a repondu 200. C'est le pire des
# symptomes : correct partout sauf la ou l'utilisateur regarde.
#
# `credentials: 'include'` cote client (frontend/src/utils/download.ts) interdit
# le joker `*` : il faut renvoyer l'origine EXACTE, d'ou ce map. La seconde
# expression couvre les sous-domaines de tenant, comme CORS_ORIGIN_REGEX cote
# backend — les deux listes doivent rester coherentes.
map $http_origin $cors_origine_autorisee {
    default                                "";
    "~^https://(www\.)?onec-rdc\.org$"     $http_origin;
    "~^https://[a-z0-9-]+\.onec-rdc\.org$" $http_origin;
}

server {
    listen 80;
    server_name api.onec-rdc.org;

    location / {
        proxy_pass http://backend:8000;

        # Meme reglage que frontend/nginx.conf : le defaut de 60 s coupait des
        # exports qui durent legitimement plus longtemps (112 s mesures le
        # 28/08 pour les encaissements d'un exercice). 130 s = --timeout
        # gunicorn + marge, pour que ce soit gunicorn qui tranche.
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_protected_uploads/ {
        internal;
        alias /var/www/onec_smart_data/uploads/;

        # Restitue ce que la redirection interne a fait perdre (cf. le map).
        # Une valeur vide n'emet aucun en-tete : une origine non autorisee
        # repart donc sans CORS, exactement comme aujourd'hui.
        add_header Access-Control-Allow-Origin      $cors_origine_autorisee always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary                             "Origin" always;

        # Fichiers nominatifs : cache navigateur seulement, jamais partage.
        add_header Cache-Control "private, max-age=3600, no-transform" always;
        # Un add_header dans un location annule TOUS ceux herites du niveau
        # server : ce bloc doit porter lui-meme tout ce qu'il veut voir sortir.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP volontairement plus stricte que celle d'un document applicatif :
        # ce sont des fichiers televerses par des utilisateurs, servis depuis
        # l'origine de l'API.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
    }
}
