server {
    listen 80;
    server_name api.onec-rdc.org;

    location / {
        proxy_pass http://backend:8000;

        # Meme reglage que frontend/nginx.conf : le defaut de 60 s coupait des
        # exports qui durent legitimement plus longtemps (112 s mesures le
        # 28/08 pour les encaissements d'un exercice). 130 s = --timeout
        # gunicorn + marge, pour que ce soit gunicorn qui tranche.
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_protected_uploads/ {
        internal;
        alias /var/www/onec_smart_data/uploads/;
    }
}
